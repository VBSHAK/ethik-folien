<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Herz oder Kopf?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
/* ================================================================
   HERZ ODER KOPF? — Gesinnungs- und Verantwortungsethik
   Tasten:  Leertaste / →  weiter      ←  zurück
            N  Sprechtext ein/aus      S  ganzes Skript (druckbar)
            F  Vollbild                C  Uhr starten/stoppen
            1 / 2  Stimme für linke / rechte Seite (bei Abstimmungen)
   ================================================================ */
:root{
  --paper:#F6F1E7; --paper2:#EDE4D3; --card:#FFFDF8;
  --ink:#17172B; --ink2:#46455C; --ink3:#7C798E; --line:#DCD1BD;
  --herz:#E0482F; --herz2:#B8321C; --herzs:#FBE0D8;
  --kopf:#2752C7; --kopf2:#1B3C99; --kopfs:#DCE5FA;
  --gold:#C4952B; --golds:#F5E7C3;
  --luis:#6A4DE0; --ciepi:#0C9483;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#12121F;overflow:hidden;font-family:"Bricolage Grotesque",system-ui,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-ligatures:common-ligatures no-discretionary-ligatures no-historical-ligatures no-contextual}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
h1,h2,h3,p{margin:0}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;
  background:var(--paper);overflow:hidden;border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
/* Papierstruktur */
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(900px 500px at 8% -10%, rgba(224,72,47,.10), transparent 60%),
   radial-gradient(900px 500px at 105% 110%, rgba(39,82,199,.10), transparent 60%),
   repeating-linear-gradient(0deg, rgba(23,23,43,.018) 0 1px, transparent 1px 4px)}

/* ---------- Grundgerüst einer Folie ---------- */
.slide{position:absolute;inset:0;padding:54px 84px 70px;display:flex;flex-direction:column;z-index:1;
  animation:slin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes slin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:18px;margin-bottom:26px;flex:none}
.sec{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:17px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
.sec b{color:var(--ink);font-weight:700}
.spk{margin-left:auto;display:flex;align-items:center;gap:7px;padding:3px 12px 3px 3px;border-radius:99px;
  background:transparent;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--ink3);opacity:.75}
.spk i{width:22px;height:22px;font-size:11px!important;border-radius:50%;background:var(--sc);color:#fff;display:flex;
  align-items:center;justify-content:center;font-style:normal;font-size:18px}
.spk small{font-size:12px;font-weight:600;color:var(--ink3);margin-left:4px}
.spk.luis{--sc:var(--luis)} .spk.ciepi{--sc:var(--ciepi)}
.body{flex:1;min-height:0;display:flex;position:relative}

.display{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:132px;line-height:.9;letter-spacing:-.035em}
.h1{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:74px;line-height:.98;letter-spacing:-.025em}
.h2{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:50px;line-height:1.02;letter-spacing:-.02em}
.h3{font-weight:800;font-size:30px;line-height:1.12}
.lead{font-size:30px;line-height:1.36;color:var(--ink2)}
.txt{font-size:24px;line-height:1.42;color:var(--ink2)}
.mono{font-family:"JetBrains Mono",monospace}
.kick{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3)}
.herz{color:var(--herz)} .kopf{color:var(--kopf)}
em.hl{font-style:normal;background:linear-gradient(transparent 58%, var(--golds) 58%);padding:0 4px}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:26px 30px;
  box-shadow:0 10px 30px rgba(23,23,43,.07)}
.card.h{border-color:var(--herz);background:linear-gradient(180deg,#FFF8F5,#FFFDF8)}
.card.k{border-color:var(--kopf);background:linear-gradient(180deg,#F6F8FF,#FFFDF8)}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-weight:800;
  font-size:19px;background:var(--paper2);color:var(--ink2)}
.chip.h{background:var(--herzs);color:var(--herz2)} .chip.k{background:var(--kopfs);color:var(--kopf2)}
.chip.g{background:var(--golds);color:#7A5A12}

/* Schritt-für-Schritt aufdecken */
[data-step]{opacity:0;transform:translateY(14px);transition:opacity .45s ease, transform .5s cubic-bezier(.2,.8,.2,1)}
[data-step].on{opacity:1;transform:none}
[data-step].pop.on{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

/* ---------- Symbole ---------- */
.ico{display:inline-block;flex:none}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.beat{animation:beat 1.6s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(1)}36%{transform:scale(1.06)}}
.ripple circle{transform-origin:center;transform-box:fill-box;animation:rip 2.6s ease-out infinite}
.ripple circle:nth-child(2){animation-delay:.6s}.ripple circle:nth-child(3){animation-delay:1.2s}
@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.25);opacity:0}}

/* ---------- Abstimmung (Hände zählen) ---------- */
.tally{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:center;gap:26px}
.tside{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:22px;padding:18px 16px 16px;
  background:var(--card);border:2.5px solid var(--tc);box-shadow:0 6px 0 var(--tc);position:relative;
  transition:transform .12s}
.tside.a{--tc:var(--herz)} .tside.b{--tc:var(--kopf)}
.tside:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tc)}
.tside .tl{font-weight:800;font-size:25px;text-align:center;line-height:1.15;color:var(--ink)}
.tside .tn{font-family:"Fraunces",serif;font-weight:800;font-size:84px;line-height:.9;color:var(--tc)}
.tside .th{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.tside .tm{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;
  background:var(--paper2);font-weight:800;font-size:22px;color:var(--ink3);line-height:1}
.rope{position:relative;height:120px}
.rope .ln{position:absolute;left:0;right:0;top:50%;height:14px;margin-top:-7px;border-radius:7px;
  background:repeating-linear-gradient(115deg,#B89260 0 10px,#9C7646 10px 20px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rope .mid{position:absolute;left:50%;top:10px;bottom:10px;width:3px;margin-left:-1.5px;background:var(--ink);opacity:.25;border-radius:2px}
.rope .knot{position:absolute;top:50%;left:var(--p,50%);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:var(--gold);border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:left .6s cubic-bezier(.2,1.3,.4,1)}
.rope .pct{position:absolute;bottom:-6px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20px}
.rope .pct.l{left:0;color:var(--herz)} .rope .pct.r{right:0;color:var(--kopf)}

/* ---------- Karten zum Umdrehen ---------- */
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;
  padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.flip .fa{background:var(--card);border:1.5px solid var(--line);box-shadow:0 10px 30px rgba(23,23,43,.08)}
.flip .fb{transform:rotateY(180deg);color:#fff}
.flip .fb.h{background:linear-gradient(150deg,var(--herz),var(--herz2))}
.flip .fb.k{background:linear-gradient(150deg,var(--kopf),var(--kopf2))}
.flip .n{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--ink3)}
.flip .q{font-size:25px;line-height:1.3;font-weight:600}
.flip .ask{margin-top:auto;display:flex;gap:10px;font-weight:800;font-size:20px}
.flip .fb .v{font-family:"Fraunces",serif;font-weight:800;font-size:44px;line-height:1}
.flip .fb p{font-size:21px;line-height:1.35;opacity:.95}

/* ---------- Fuß: Fortschritt ---------- */
#foot{position:absolute;left:84px;right:84px;bottom:22px;display:flex;align-items:center;gap:18px;z-index:5}
#bar{flex:1;display:flex;gap:5px}
#bar i{flex:1;height:7px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
#bar i.l::after,#bar i.c::after{content:"";position:absolute;inset:0;border-radius:4px;opacity:0;transition:opacity .3s}
#bar i.l::after{background:var(--luis)} #bar i.c::after{background:var(--ciepi)}
#bar i.done::after{opacity:.45} #bar i.now::after{opacity:1}
#num{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;color:var(--ink3);letter-spacing:.08em}
#clock{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;color:var(--ink3);min-width:9ch;text-align:right}
#clock.run{color:var(--ink)} #clock.over{color:var(--herz)}
.navb{width:34px;height:34px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font-size:18px;
  color:var(--ink2);display:flex;align-items:center;justify-content:center}
.navb:hover{border-color:var(--ink)}

/* ---------- Sprechtext ---------- */
#notes{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(1100px,94vw);max-height:44vh;overflow:auto;
  background:rgba(18,18,31,.96);color:#EDEAF6;border-radius:16px;padding:18px 24px;z-index:50;display:none;
  font-size:18px;line-height:1.5;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#notes.show{display:block}
#notes .nh{display:flex;gap:12px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.12em;
  text-transform:uppercase;color:#A9A5C2;margin-bottom:8px}
#notes .nh b{padding:3px 10px;border-radius:99px;color:#fff}
#notes ul{margin:10px 0 0;padding-left:20px;color:#C9C5DE;font-size:16px}
#script{position:fixed;inset:0;z-index:60;background:#F6F1E7;overflow:auto;display:none;padding:40px 20px 80px}
#script.show{display:block}
#script .sw{max-width:860px;margin:0 auto}
#script h1{font-family:"Fraunces",serif;font-size:46px;margin-bottom:6px}
#script .row{border-top:1.5px solid var(--line);padding:18px 0;display:grid;grid-template-columns:120px 1fr;gap:18px;break-inside:avoid}
#script .who{font-weight:800;font-size:18px}
#script .who small{display:block;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:13px;color:var(--ink3);margin-top:3px}
#script .say{font-size:18px;line-height:1.55}
#script .act{font-size:15px;color:var(--ink3);margin-top:6px}
#script .x{position:fixed;top:16px;right:20px;background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-weight:700}
#help{position:fixed;left:14px;top:12px;color:#8F8BA8;font-family:"JetBrains Mono",monospace;font-size:12px;z-index:4;opacity:.8}
@media print{
  body{background:#fff;overflow:visible} #viewport,#help,#notes,#script .x{display:none!important}
  #script{display:block!important;position:static;padding:0}
}

/* ---------- Einzelne Folien ---------- */
.door{position:relative;width:360px;height:560px;flex:none}
.door .knock{position:absolute;font-family:"Fraunces",serif;font-weight:800;font-style:italic;color:var(--ink);font-size:44px;
  animation:knock 1.8s ease-in-out infinite}
@keyframes knock{0%,60%,100%{transform:rotate(-6deg) scale(1);opacity:.9}66%{transform:rotate(4deg) scale(1.12);opacity:1}72%{transform:rotate(-8deg) scale(1)}}
.lightsl{animation:flick 3s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.95}45%{opacity:.6}50%{opacity:1}}

.vs{width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;
  justify-content:center;font-family:"Fraunces",serif;font-weight:800;font-style:italic;font-size:38px;flex:none;
  box-shadow:0 0 0 10px var(--paper)}

.panel3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.comic{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:22px 22px 18px;
  display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--ink)}
.comic .who{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px}
.av{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:800;font-size:26px;flex:none;border:3px solid var(--ink)}
.bubble{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:14px 18px;
  font-size:23px;line-height:1.3;font-weight:600}
.bubble::before{content:"";position:absolute;left:26px;top:-14px;width:20px;height:20px;background:var(--paper);
  border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}

.cmp{display:grid;grid-template-columns:230px 1fr 1fr;gap:12px 18px;align-items:stretch}
.cmp .rl{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);display:flex;align-items:center}
.cmp .c{border-radius:14px;padding:13px 20px;font-size:23px;line-height:1.3;font-weight:600;display:flex;align-items:center}
.cmp .c.h{background:var(--herzs);color:#6E1D0F} .cmp .c.k{background:var(--kopfs);color:#12296A}
.cmp .hd{border-radius:16px;padding:16px 20px;color:#fff;display:flex;align-items:center;gap:14px}
.cmp .hd.h{background:var(--herz)} .cmp .hd.k{background:var(--kopf)}
.cmp .hd b{font-family:"Fraunces",serif;font-size:32px;line-height:1}

.medal{width:190px;height:190px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#E9E0CC 70%);
  border:6px solid var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.18), inset 0 -8px 20px rgba(0,0,0,.07);overflow:hidden}
.quote{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:34px;line-height:1.28;color:var(--ink)}
.quote::before{content:"„";color:var(--gold);font-size:1.5em;margin-right:4px}
.src{font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--ink3);letter-spacing:.08em;margin-top:10px}

.tline{position:relative;flex:1;display:flex;flex-direction:column}
.axis{position:absolute;left:0;right:0;top:318px;height:6px;border-radius:3px;background:var(--ink)}
.axis::after{content:"";position:absolute;right:-6px;top:-8px;border-left:18px solid var(--ink);border-top:11px solid transparent;border-bottom:11px solid transparent}
.gap{position:absolute;top:300px;left:19%;width:96px;height:44px;background:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;color:var(--ink3)}
.gap::before,.gap::after{content:"";position:absolute;top:0;bottom:0;width:5px;background:var(--ink);transform:skewX(-18deg)}
.gap::before{left:6px}.gap::after{right:6px}
.ph{position:absolute;width:210px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.ph .md{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#E9E0CC 70%);
  border:5px solid var(--pc);box-shadow:0 8px 20px rgba(0,0,0,.14);overflow:hidden}
.ph.up{top:40px}.ph.dn{top:352px}
.ph .nm{font-weight:800;font-size:23px;line-height:1.05}
.ph .yr{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink3);font-weight:700}
.ph .ds{font-size:18px;line-height:1.3;color:var(--ink2)}
.ph .tg{font-size:14px;padding:3px 12px}
.ph::after{content:"";position:absolute;left:50%;width:3px;background:var(--pc);margin-left:-1.5px}
.ph.up::after{top:100%;height:calc(318px - 40px - 100%)}
.ph.dn::after{bottom:100%;height:28px}
.ph.dot::before{content:"";position:absolute;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--pc);border:4px solid var(--paper)}
.ph.up.dot::before{top:calc(318px - 40px - 8px)}
.ph.dn.dot::before{top:-42px}

.rings{position:relative;width:640px;height:640px;flex:none}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;
  transition:transform .8s cubic-bezier(.2,1.2,.4,1),opacity .4s;display:flex;justify-content:center}
.ring.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.ring span{position:absolute;top:8px;background:var(--card);border-radius:99px;padding:4px 14px;font-weight:800;font-size:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.1);white-space:nowrap}

.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;flex:1;min-height:0;margin-bottom:8px}
.fields .fi{font-size:72px!important} .fields h3{font-size:36px!important} .fields p{font-size:23px!important}
.fields .duo div{font-size:20px!important;padding:10px 14px!important}
.field{border-radius:22px;padding:24px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 30px rgba(23,23,43,.07);position:relative;overflow:hidden}
.field .fi{font-size:54px;line-height:1}
.field h3{font-size:30px;font-weight:800}
.field p{font-size:20px;line-height:1.38;color:var(--ink2)}
.field .duo{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.field .duo div{font-size:17px;line-height:1.3;padding:8px 12px;border-radius:10px}
.field .duo .h{background:var(--herzs);color:#6E1D0F}.field .duo .k{background:var(--kopfs);color:#12296A}

.scale{position:relative;width:560px;height:560px;flex:none}
.beam{position:absolute;left:30px;right:30px;top:130px;height:0;transform:rotate(var(--tilt,0deg));transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
.beam .bar{position:absolute;left:0;right:0;top:-7px;height:14px;border-radius:7px;background:var(--ink)}
.pan{position:absolute;top:0;width:190px;transform:rotate(calc(var(--tilt,0deg) * -1));transform-origin:50% 0;transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
.pan.l{left:-60px}.pan.r{right:-60px}
.pan .str{height:120px;margin:0 auto;width:120px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);
  clip-path:polygon(50% 0,100% 100%,0 100%);background:transparent}
.pan .dish{height:36px;border-radius:0 0 95px 95px;margin-top:-2px}
.pan.l .dish{background:var(--herz)}.pan.r .dish{background:var(--kopf)}
.pan .w{display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:4px;position:absolute;bottom:34px;left:10px;right:10px}
.pan .w i{width:30px;height:24px;border-radius:6px 6px 3px 3px;background:var(--gold);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);animation:pop .4s both}
.post{position:absolute;left:50%;top:120px;bottom:40px;width:18px;margin-left:-9px;background:var(--ink);border-radius:9px}
.foot{position:absolute;left:50%;bottom:20px;width:220px;height:34px;margin-left:-110px;background:var(--ink);border-radius:17px 17px 6px 6px}
.pivot{position:absolute;left:50%;top:110px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--gold);border:5px solid var(--ink);z-index:2}
.klist{display:flex;flex-direction:column;gap:12px}
.kitem{display:flex;gap:14px;align-items:flex-start;font-size:22px;line-height:1.32;font-weight:600;padding:13px 18px;border-radius:14px}
.kitem.h{background:var(--herzs);color:#6E1D0F}.kitem.k{background:var(--kopfs);color:#12296A}
.kitem b{font-size:26px;line-height:1}

.eq{display:flex;align-items:center;gap:30px;justify-content:center}
.eq .t{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:26px}
.eq .op{font-family:"Fraunces",serif;font-weight:800;font-size:90px;color:var(--ink3)}
.take{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.take .card{display:flex;gap:16px;align-items:flex-start}
.take .card > b{font-family:"Fraunces",serif;font-size:52px;line-height:.9;color:var(--gold)}
.take .card p{font-size:22px;line-height:1.35;color:var(--ink2)}

.qrwrap{background:#fff;border-radius:26px;padding:22px;box-shadow:0 20px 60px rgba(23,23,43,.18);border:1.5px solid var(--line);flex:none}
.qrwrap canvas{display:block;width:380px;height:380px;image-rendering:pixelated}
.url{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:34px;color:var(--herz);word-break:break-all;line-height:1.1}
.steps3{display:flex;flex-direction:column;gap:14px}
.steps3 div{display:flex;gap:16px;align-items:center;font-size:26px;font-weight:600}
.steps3 b{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;flex:none}
.teams{display:flex;gap:14px}
.team{flex:1;border-radius:18px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;font-weight:800;font-size:24px;line-height:1.1}
.team small{display:block;font-weight:500;font-size:16px;opacity:.9;margin-top:3px}
.team.h{background:linear-gradient(150deg,var(--herz),var(--herz2))}.team.k{background:linear-gradient(150deg,var(--kopf),var(--kopf2))}
.dancers{display:flex;gap:6px;align-items:flex-end}
.dancers span{font-size:46px;display:inline-block;animation:dnc .9s ease-in-out infinite}
.dancers span:nth-child(2){animation-delay:.15s}.dancers span:nth-child(3){animation-delay:.3s}.dancers span:nth-child(4){animation-delay:.45s}
@keyframes dnc{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:-30px;width:12px;height:18px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(980px) rotate(620deg)}}
</style>

<script>
(function(){
"use strict";

/* ================================================================
   HIER DIE ADRESSE DES QUIZ EINTRAGEN (nach dem GitHub-Upload).
   Der QR-Code auf der letzten Folie wird daraus erzeugt.
   ================================================================ */
var QUIZURL = "https://rechthak.github.io/ethik-quiz/";

var SPK = {Luis:{c:"luis",i:"L"}, Ciepi:{c:"ciepi",i:"C"}};

/* ---------------------------------------------------------- Symbole */
function heartIco(size,col){
  return '<svg class="ico beat" width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true">'+
    '<circle cx="50" cy="50" r="47" fill="'+(col||"#E0482F")+'"/>'+
    '<circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 5"/>'+
    '<path d="M50 76 C22 58 20 38 32 30 C41 24 48 30 50 36 C52 30 59 24 68 30 C80 38 78 58 50 76Z" fill="#fff"/>'+
    '<path d="M50 14 L54 24 L46 24Z" fill="#fff"/></svg>';
}
function headIco(size,col){
  return '<svg class="ico" width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true">'+
    '<circle cx="50" cy="50" r="47" fill="'+(col||"#2752C7")+'"/>'+
    '<g class="ripple" fill="none" stroke="#fff" stroke-width="3"><circle cx="50" cy="52" r="30"/><circle cx="50" cy="52" r="30"/><circle cx="50" cy="52" r="30"/></g>'+
    '<circle cx="50" cy="52" r="17" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="6.7 6.65"/>'+
    '<circle cx="50" cy="52" r="15" fill="#fff"/><circle cx="50" cy="52" r="6" fill="'+(col||"#2752C7")+'"/></svg>';
}
/* Stilisierte Büsten für die Ahnengalerie */
function bust(kind){
  var skin="#E8C9A6", s="";
  var hair={plato:"#8A8580",ari:"#6E6259",kant:"#EDEDEA",mill:"#5A4A3E",weber:"#3B302A",jonas:"#9A9894"}[kind];
  s+='<rect width="120" height="120" fill="none"/>';
  if(kind==="plato"||kind==="ari"){
    s+='<path d="M20 120 Q24 88 60 84 Q96 88 100 120Z" fill="#F4F1EA"/><path d="M34 120 Q44 96 76 90 L86 120Z" fill="#E4DED0"/>';
  } else {
    s+='<path d="M18 120 Q22 88 60 84 Q98 88 102 120Z" fill="#2F3340"/><path d="M52 86 L60 104 L68 86Z" fill="#fff"/>';
    if(kind==="kant") s+='<path d="M50 86 Q60 96 70 86 L66 100 L54 100Z" fill="#fff"/>';
    else s+='<path d="M57 92 L60 110 L63 92Z" fill="#8E2A2A"/>';
  }
  s+='<rect x="52" y="66" width="16" height="22" fill="'+skin+'"/>';
  s+='<ellipse cx="60" cy="50" rx="22" ry="25" fill="'+skin+'"/>';
  if(kind==="kant"){ s+='<path d="M36 50 Q36 22 60 22 Q84 22 84 50 Q80 36 60 34 Q40 36 36 50Z" fill="'+hair+'"/>'+
     '<circle cx="36" cy="54" r="7" fill="'+hair+'"/><circle cx="84" cy="54" r="7" fill="'+hair+'"/>'; }
  else if(kind==="jonas"){ s+='<path d="M38 42 Q44 26 60 26 Q76 26 82 42 Q74 34 60 33 Q46 34 38 42Z" fill="'+hair+'"/>'+
     '<g fill="none" stroke="#222" stroke-width="2.4"><circle cx="51" cy="50" r="7"/><circle cx="69" cy="50" r="7"/><path d="M58 50h4"/></g>'; }
  else { s+='<path d="M38 46 Q38 24 60 24 Q82 24 82 46 Q76 34 60 32 Q44 34 38 46Z" fill="'+hair+'"/>'; }
  if(kind==="plato"||kind==="ari"||kind==="weber"){
    s+='<path d="M40 56 Q42 86 60 88 Q78 86 80 56 Q74 70 60 70 Q46 70 40 56Z" fill="'+hair+'"/>';
  }
  if(kind==="plato"||kind==="ari"){ s+='<path d="M36 38 Q60 20 84 38" fill="none" stroke="#5C8A3A" stroke-width="5" stroke-dasharray="6 3" stroke-linecap="round"/>'; }
  if(kind==="mill"){ s+='<path d="M38 56 Q36 72 44 76" stroke="'+hair+'" stroke-width="6" fill="none"/><path d="M82 56 Q84 72 76 76" stroke="'+hair+'" stroke-width="6" fill="none"/>'; }
  if(kind!=="jonas"){ s+='<circle cx="51" cy="50" r="2.6" fill="#222"/><circle cx="69" cy="50" r="2.6" fill="#222"/>'; }
  if(kind!=="plato"&&kind!=="ari"&&kind!=="weber"){ s+='<path d="M52 64 Q60 69 68 64" stroke="#8A4C3C" stroke-width="2.4" fill="none" stroke-linecap="round"/>'; }
  return '<svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">'+s+'</svg>';
}
function tally(id,a,b,ha,hb){
  return '<div class="tally" data-tally="'+id+'">'+
    '<button class="tside a" data-side="a"><span class="tm" data-minus="a">−</span>'+
      '<span class="tl">'+a+'</span><span class="tn" data-n="a">0</span><span class="th">'+(ha||"Taste 1 · Klick")+'</span></button>'+
    '<div class="rope"><div class="ln"></div><div class="mid"></div><div class="knot"></div>'+
      '<span class="pct l" data-p="a">–</span><span class="pct r" data-p="b">–</span></div>'+
    '<button class="tside b" data-side="b"><span class="tm" data-minus="b">−</span>'+
      '<span class="tl">'+b+'</span><span class="tn" data-n="b">0</span><span class="th">'+(hb||"Taste 2 · Klick")+'</span></button>'+
  '</div>';
}

/* ============================================================ FOLIEN */
var SL=[];
function slide(o){ SL.push(o); }

/* 1 — Kaltstart: Gedankenspiel */
slide({spk:"Luis", sec:"Gedankenspiel 1", min:"0:40",

      '</svg>'+

  notes:{say:"Kurzes Gedankenspiel: Eure beste Freundin versteckt sich bei euch. Es klopft. Draußen steht jemand, der ihr etwas antun will: Ist sie bei dir? Hände hoch: Wer lügt? … Wer sagt die Wahrheit? … Plot-Twist: Kant sagt, man darf nie lügen. Auch hier nicht. Wer hat recht? Das klären wir jetzt.",

  '<div class="body" style="align-items:center;gap:60px">'+
    '<div style="flex:1;display:flex;flex-direction:column;gap:26px">'+

        '<span class="chip" style="font-size:16px">Luis &amp; Ciepi</span>'+

/* 3 — Grundidee */
slide({spk:"Ciepi", sec:"1 · Die Grundidee", min:"0:35",
  html:
  '<div class="body" style="flex-direction:column;gap:26px">'+
    '<h2 class="h2">Zwei Fragen, bevor du handelst</h2>'+
    '<div style="display:flex;align-items:center;gap:0">'+
      '<div class="card h" style="flex:1;display:flex;gap:22px;align-items:center;padding:28px 34px">'+heartIco(120)+
        '<div><span class="kick herz">Gesinnungsethik</span><p class="h2" style="font-size:40px;margin-top:6px">„Ist meine <u>Absicht</u> moralisch gut?“</p></div></div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">'+

function render(){
  var o=SL[cur];
  slot.innerHTML='<section class="slide"><div class="top"><span class="sec">'+o.sec+'</span>'+spkChip(o)+'</div>'+o.html+'</section>';
  var el=slot.firstChild, st=el.querySelectorAll("[data-step]"), m=0;
  for(var i=0;i<st.length;i++) m=Math.max(m,+st[i].getAttribute("data-step"));
  maxStep=Math.max(m, o.steps||0);
  wire(el); apply(); foot(); notes();
  if(o.quiz) quizSlide(el);
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
}
function apply(){
  var el=slot.firstChild; if(!el) return;
  var st=el.querySelectorAll("[data-step]");
  for(var i=0;i<st.length;i++) st[i].classList.toggle("on", +st[i].getAttribute("data-step")<=step);
  if(SL[cur].onStep) SL[cur].onStep(step, el);
}
function next(){
  startClock();
  if(step<maxStep){ step++; apply(); }
  else if(cur<SL.length-1){ cur++; step=0; render(); }
}
function prev(){
  if(step>0){ step--; apply(); }
  else if(cur>0){ cur--; render(); step=maxStep; apply(); }
}
function foot(){
  document.getElementById("num").textContent=(cur+1)+" / "+SL.length;
  var b=document.getElementById("bar"), h="";
  SL.forEach(function(o,i){ h+='<i class="'+(o.spk==="Luis"?"l":"c")+(i<cur?" done":"")+(i===cur?" now":"")+'" title="'+o.spk+'"></i>'; });
  b.innerHTML=h;
}
function notes(){
  var o=SL[cur], n=SL[cur+1];
  notesEl.innerHTML='<div class="nh"><b style="background:var(--'+SPK[o.spk].c+')">'+o.spk+(o.spk2?" + "+o.spk2:"")+'</b>'+
    'Folie '+(cur+1)+' · ca. '+o.min+(n?' · danach: '+n.spk:'')+'</div>'+
    '<div>'+o.notes.say+'</div><ul>'+o.notes.act.map(function(a){return "<li>"+a+"</li>";}).join("")+'</ul>';
}
function buildScript(){
  var h='<button class="x" id="sx">Schließen (S)</button><div class="sw"><span class="kick">Sprechtext · Luis &amp; Ciepi</span>'+
    '<h1>Herz oder Kopf?</h1><p class="txt" style="margin-bottom:20px">Mit Strg+P ausdrucken. Gesamtzeit ca. 8 Minuten.</p>';
  SL.forEach(function(o,i){
    h+='<div class="row"><div class="who" style="color:var(--'+SPK[o.spk].c+')">'+(i+1)+'. '+o.spk+(o.spk2?" + "+o.spk2:"")+
      '<small>'+o.min+' min</small></div><div><div class="kick" style="margin-bottom:6px">'+o.sec+'</div>'+
      '<div class="say">'+o.notes.say+'</div><div class="act">▸ '+o.notes.act.join(" · ")+'</div></div></div>';
  });
  scriptEl.innerHTML=h+'</div>';
  document.getElementById("sx").onclick=function(){ scriptEl.classList.remove("show"); };
}

/* Abstimmungen: Zählerstand bleibt beim Hin- und Herblättern erhalten */
function wire(el){
  Array.prototype.forEach.call(el.querySelectorAll("[data-tally]"),function(t){
    var id=t.getAttribute("data-tally"); if(!T[id]) T[id]={a:0,b:0};
    t.querySelectorAll("[data-side]").forEach(function(b){
      b.onclick=function(e){ if(e.target.hasAttribute("data-minus")) return; T[id][b.getAttribute("data-side")]++; paintT(t); };
    });
    t.querySelectorAll("[data-minus]").forEach(function(m){
      m.onclick=function(e){ e.stopPropagation(); var s=m.getAttribute("data-minus"); T[id][s]=Math.max(0,T[id][s]-1); paintT(t); };
    });
    paintT(t);
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-flip]"),function(f){
    f.onclick=function(){ f.classList.toggle("open"); };
  });
}
function paintT(t){
  var v=T[t.getAttribute("data-tally")], tot=v.a+v.b;
  t.querySelector('[data-n="a"]').textContent=v.a; t.querySelector('[data-n="b"]').textContent=v.b;
  var pa=tot?Math.round(v.a/tot*100):50;
  /* Mehr Stimmen ziehen das Seil auf die eigene Seite */
  t.querySelector(".knot").style.setProperty("--p",(tot?(100-pa):50)+"%");
  t.querySelector('[data-p="a"]').textContent=tot?pa+"%":"–";
  t.querySelector('[data-p="b"]').textContent=tot?(100-pa)+"%":"–";
}
function tallyKey(side){
  var t=slot.querySelector("[data-tally]"); if(!t) return;
  var host=t.closest("[data-step]"); if(host && !host.classList.contains("on")) return;
  T[t.getAttribute("data-tally")][side]++; paintT(t);
}

function quizSlide(el){
  document.getElementById("qurl").textContent=QUIZURL.replace(/^https?:\/\//,"").replace(/\/$/,"");
  var cv=document.getElementById("qrcv");
  if(typeof QRious!=="undefined"){ try{ new QRious({element:cv,value:QUIZURL,size:760,level:"M",background:"#ffffff",foreground:"#17172B",padding:0}); }catch(e){} }
  else document.getElementById("qrbox").style.display="none";
  var c=document.getElementById("conf"), cols=["#E0482F","#2752C7","#C4952B","#0C9483","#6A4DE0"];
  for(var i=0;i<40;i++){ var d=document.createElement("i"); d.style.left=Math.random()*100+"%";
    d.style.background=cols[i%cols.length]; d.style.animationDuration=(4+Math.random()*4)+"s";
    d.style.animationDelay=(-Math.random()*8)+"s"; d.style.opacity=.55; c.appendChild(d); }
}

/* ---------------------------------------------------------- Uhr */
var t0=0, run=false, acc=0;
function startClock(){ if(!run && !acc){ t0=Date.now(); run=true; } }
function toggleClock(){ if(run){ acc+=Date.now()-t0; run=false; } else { t0=Date.now(); run=true; } }
setInterval(function(){
  var ms=acc+(run?Date.now()-t0:0), s=Math.floor(ms/1000), c=document.getElementById("clock");
  c.textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2)+" / 8:00";
  c.className=(run?"run":"")+(s>480?" over":"");
},500);

/* ---------------------------------------------------------- Tasten */
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k===" "||k==="ArrowRight"||k==="PageDown"||k==="Enter"){ e.preventDefault(); next(); }
  else if(k==="ArrowLeft"||k==="PageUp"||k==="Backspace"){ e.preventDefault(); prev(); }
  else if(k==="n"||k==="N") notesEl.classList.toggle("show");
  else if(k==="s"||k==="S"){ buildScript(); scriptEl.classList.toggle("show"); }
  else if(k==="c"||k==="C") toggleClock();
  else if(k==="f"||k==="F"){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
  else if(k==="1") tallyKey("a");
  else if(k==="2") tallyKey("b");
  else if(k==="Home"){ cur=0; step=0; render(); }
  else if(k==="End"){ cur=SL.length-1; step=0; render(); }
});
document.getElementById("nx").onclick=next;
document.getElementById("pv").onclick=prev;

var h=parseInt((location.hash||"").slice(1),10);
if(h>=1 && h<=SL.length) cur=h-1;
render();
})();
</script>
